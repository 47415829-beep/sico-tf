# Integración continua: se ejecuta en cada Pull Request hacia develop o main
name: CI SICO-TF
on:
  pull_request:
    branches: [develop, main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Crear la base de datos con el script oficial
        run: PGPASSWORD=ci psql -h localhost -U ci -v ON_ERROR_STOP=1 -f db/SICO-TF_BD_PostgreSQL_PostGIS.sql
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar dependencias y ejecutar pruebas unitarias
        working-directory: backend
        run: npm ci && npm test -- --coverage
